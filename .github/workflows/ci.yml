name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets the checks be re-run by hand without an empty commit.
  workflow_dispatch:

# A new push to the same branch makes an in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Kept in step with .nvmrc; 22.5+ is required for node:sqlite.
          node-version-file: .nvmrc
          cache: pnpm

      # Fails rather than resolving something new, so CI tests the same tree
      # a developer installed.
      - run: pnpm install --frozen-lockfile

      # `test` runs with --coverage and fails below 100%, so this is the
      # coverage gate as well as the test gate.
      - run: pnpm turbo run typecheck lint test build

      - name: Publish the coverage summary
        if: always()
        run: |
          if [ -f apps/web/coverage/coverage-summary.json ]; then
            node -e "
              const t = require('./apps/web/coverage/coverage-summary.json').total;
              const row = (k) => \`| \${k} | \${t[k].pct}% | \${t[k].covered}/\${t[k].total} |\`;
              console.log('| Metric | % | Covered |');
              console.log('| --- | --- | --- |');
              for (const k of ['statements','branches','functions','lines']) console.log(row(k));
            " >> "$GITHUB_STEP_SUMMARY"
          fi

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Build only — publishing happens on a tag, in release.yml. Catching a
      # broken Dockerfile here beats finding out during a release.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: supercalorie:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container serves traffic
        run: |
          docker run -d --name ci -p 3000:3000 \
            -e SESSION_SECRET=ci-only-not-a-real-secret supercalorie:ci

          for _ in $(seq 1 30); do
            curl -sf http://localhost:3000/api/health && break
            sleep 2
          done

          curl -sf http://localhost:3000/api/health > /dev/null
          # The spec has to be reachable unauthenticated or every integration
          # is broken, so it is worth asserting on every build.
          curl -sf http://localhost:3000/api/openapi.json > /dev/null
          docker rm -f ci
