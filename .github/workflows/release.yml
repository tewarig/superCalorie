name: Release

# Cutting a release is pushing a tag:
#
#   git tag -a v0.2.0 -m "v0.2.0" && git push origin v0.2.0
#
# which publishes a Docker image to GHCR and opens a GitHub release with the
# changelog section for that version.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)release, e.g. v0.2.0"
        required: true

permissions:
  contents: write # create the release
  packages: write # push to GHCR

jobs:
  verify:
    name: Verify before publishing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A tag that fails its own tests must not become an image anyone pulls.
      - run: pnpm turbo run typecheck lint test build

  image:
    name: Publish container image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derives :0.2.0, :0.2, :latest from the tag rather than parsing it in
      # a shell, which keeps tag text out of `run:` entirely.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # arm64 matters here: a lot of self-hosting is on a Pi or an ARM VPS.
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Create GitHub release
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract this version's changelog section
        env:
          # Via env, never inlined into the script — a tag is attacker-
          # controllable on a fork and would otherwise be shell injection.
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          # Pull the section between this version's heading and the next one.
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG.md section for $VERSION — add one before tagging." >&2
            exit 1
          fi
          cat release-notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          {
            cat release-notes.md
            echo
            echo "### Container image"
            echo
            echo '```sh'
            echo "docker pull ghcr.io/${REPO}:${TAG#v}"
            echo '```'
          } > body.md

          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file body.md \
            --verify-tag
