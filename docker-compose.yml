# Self-hosting superCalorie's backend.
#
#   echo "SESSION_SECRET=$(openssl rand -hex 32)" > .env
#   docker compose up -d
#
# Then the API is on http://localhost:3000, with a browsable reference at
# /api-docs. The apps work without any of this — run it when you want sync,
# a backup, or to let other tools reach your data.

services:
  supercalorie:
    # Swap for the published image to skip building:
    #   image: ghcr.io/tewarig/supercalorie:latest
    build: .
    image: supercalorie:local
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      # Required. Rotating it invalidates every existing session, and the
      # app refuses to start in production without it.
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET, e.g. openssl rand -hex 32}
      # Optional: food search falls back to a rate-limited demo key without it.
      USDA_API_KEY: ${USDA_API_KEY:-}
    volumes:
      # The database and photos. Losing this volume loses every account, so
      # it is what any backup needs to cover.
      - supercalorie-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  supercalorie-data:
